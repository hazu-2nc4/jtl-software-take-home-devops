deploymentMode: local-dev

replicaCount: 1

image:
  repository: jtldemo-linux
  tag: local
  # When supplied, digest takes precedence over tag. Required in production.
  digest: ""
  pullPolicy: IfNotPresent

config:
  # local-dev only. Production uses existingSecret instead.
  source: literal
  literalConnectionString: ""
  existingSecret:
    name: ""
    key: ConnectionStrings__JtlDemo

serviceAccount:
  create: false
  name: ""
  automountServiceAccountToken: false
  annotations: {}

service:
  type: ClusterIP
  port: 80
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

keyVault:
  # Requires the AKS Key Vault CSI add-on and workload identity.
  enabled: false
  name: ""
  tenantId: ""
  clientId: ""
  objectName: ""

nodeSelector:
  kubernetes.io/os: linux
  kubernetes.io/arch: amd64
tolerations: []
affinity: {}

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

probes:
  startup:
    path: /healthz
    initialDelaySeconds: 0
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 12
  liveness:
    path: /healthz
    initialDelaySeconds: 0
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    path: /healthz
    initialDelaySeconds: 0
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
